# Repo-owned golangci-lint configuration for the generated `make lint` and the
# pre-commit golangci-lint hook (both run -E gosec -E goconst -E govet on top
# of the defaults). Same shape as muster's.
version: "2"

linters:
  settings:
    goconst:
      # goconst's defaults (min-len 3, min-occurrences 3) flag table-driven
      # test fixtures and short status words; only genuine production-code
      # duplication is worth a constant.
      min-len: 5
      min-occurrences: 5
      # Skip test files when COUNTING occurrences, so fixture repetition does
      # not push a production string over the threshold. The path exclusion
      # below separately silences reports in test files.
      ignore-tests: true
      ignore-functions:
        - fmt.Errorf

  exclusions:
    rules:
      # Test fixtures legitimately repeat dummy tokens, fake URLs and table
      # data, write helper scripts with 0755 and read testdata by name.
      - path: _test\.go
        linters:
          - gosec
          - goconst
      # tokenEnv and TokenEnv are the NAMES of the environment variables
      # marge reads the CircleCI token and the Slack bot token from, not
      # credentials; G101 matches on the word.
      - path: (internal/circleci/circleci|internal/slack/slack)\.go
        linters:
          - gosec
        text: "G101"
      # Reading the operator-given --repos-file (readReposFile), the
      # CircleCI CLI's own ~/.circleci/cli.yml, the --rules-path catalogue
      # with its fixtures, the --from sweep report and the App private key
      # the chart mounts is the feature: every one of those paths is chosen
      # by the person running marge, or by the chart, never by remote input.
      - path: (cmd/(common|rules)\.go|internal/circleci/circleci\.go|internal/github/app\.go|internal/rules/(load|scenario)\.go)
        linters:
          - gosec
        text: "G304"
      # The App private key path comes from the pod's own environment, which
      # the chart sets to the Secret mount. gosec's taint analysis reports
      # every os.Getenv-derived path.
      - path: internal/github/app\.go
        linters:
          - gosec
        text: "G703"
