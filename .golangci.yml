# Repo-owned golangci-lint configuration for the generated `make lint` and the
# pre-commit golangci-lint hook (both run -E gosec -E goconst -E govet on top
# of the defaults). Same shape as muster's.
version: "2"

linters:
  settings:
    goconst:
      # goconst's defaults (min-len 3, min-occurrences 3) flag table-driven
      # test fixtures and short status words; only genuine production-code
      # duplication is worth a constant.
      min-len: 5
      min-occurrences: 5
      # Skip test files when COUNTING occurrences, so fixture repetition does
      # not push a production string over the threshold. The path exclusion
      # below separately silences reports in test files.
      ignore-tests: true
      ignore-functions:
        - fmt.Errorf

  exclusions:
    rules:
      # Test fixtures legitimately repeat dummy tokens, fake URLs and table
      # data, write helper scripts with 0755 and read testdata by name.
      - path: _test\.go
        linters:
          - gosec
          - goconst
      # tokenEnv is the NAME of the environment variable marge reads the
      # CircleCI token from, not a credential; G101 matches on the word.
      - path: internal/circleci/circleci\.go
        linters:
          - gosec
        text: "G101"
      # Reading the operator-given --repos-file and the CircleCI CLI's own
      # ~/.circleci/cli.yml is the feature: both paths are chosen by the
      # person running marge on their own machine, never by remote input.
      - path: (cmd/run\.go|internal/circleci/circleci\.go)
        linters:
          - gosec
        text: "G304"
