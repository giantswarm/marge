name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: teemow/github-workflows/.github/workflows/ci-go.yml@main
    with:
      runs-on: ubuntu-latest
  gitleaks:
    # gitleaks/gitleaks-action demands a paid license key for repositories
    # in an organization; the Giant Swarm shared workflow scans with the
    # org's own gitleaks action and reports under the same check name.
    uses: giantswarm/github-workflows/.github/workflows/gitleaks.yaml@main
    permissions:
      contents: read
