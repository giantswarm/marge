# Default values for marge.

mcp:
  # -- Run the MCP server: the Deployment, its Service and its NetworkPolicy. Turn it off on an installation that runs the scheduled sweep alone. Registering the server with a muster is the platform's job: an MCPServer that points at the Service URL, with the muster's own GitHub client.
  enabled: true

# -- Number of marge replicas. The MCP transport is stateful per session, so keep it at 1 unless a client-affine load balancer sits in front.
replicaCount: 1

image:
  # -- Registry of the marge image
  registry: gsoci.azurecr.io
  # -- Repository of the marge image
  repository: giantswarm/marge
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Image pull secrets for the pod
imagePullSecrets: []
# -- Overrides the chart name in resource names
nameOverride: ""
# -- Overrides the fully qualified resource name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the pod. marge talks to GitHub and CircleCI only, so it needs no Kubernetes API access.
  create: true
  # -- Mount the ServiceAccount token into the pod
  automount: false
  # -- Annotations to add to the ServiceAccount
  annotations: {}  # @schema additionalProperties: true
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty and create is true.
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels to add to the pod
podLabels: {}  # @schema additionalProperties: true

# -- Pod-level security context (restricted Pod Security Standard)
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (restricted Pod Security Standard)
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Service port; the container listens on 8080
  port: 8080

# -- Container resources. The pod mounts an emptyDir on /tmp, so ephemeral-storage is bounded as well: a container that mounts one without both bounds is refused by the restricted policies.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 1Gi
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi

# -- Node selector for the pod
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations for the pod
tolerations: []
# -- Affinity for the pod
affinity: {}  # @schema additionalProperties: true

marge:
  github:
    # -- GitHub token marge uses (needs the permissions listed in the repository README). The chart writes it into a Secret; prefer existingSecret in production. The scheduled sweeps ignore it and act as the App instead.
    token: ""
    # -- Name of an existing Secret holding the GitHub token. Takes precedence over token.
    existingSecret: ""
    # -- Key of the GitHub token inside existingSecret
    existingSecretKey: "token"
    app:
      # -- Numeric ID of the sweep GitHub App. Required by the scheduled sweeps, which mint an installation token per repository instead of holding a token.
      id: ""
      # -- Numeric ID of the App's installation on the organization.
      installationId: ""
      # -- PEM private key of the App. The chart writes it into a Secret; prefer existingSecret in production. The values of this item live in 1Password, in the Team Bumblebee vault, item "marge sweep GitHub App".
      privateKey: ""
      # -- Name of an existing Secret holding the App credential. Takes precedence over the inline values, and must carry every key named below.
      existingSecret: ""
      # -- Key of the App ID inside the Secret
      idKey: "github-app-id"
      # -- Key of the installation ID inside the Secret
      installationIdKey: "github-app-installation-id"
      # -- Key of the PEM private key inside the Secret
      privateKeyKey: "github-app-private-key"
  slack:
    # -- Bot token of the sweep's own Slack app, which holds chat:write and nothing else. Without it a scheduled sweep does its work and posts no summary.
    token: ""
    # -- Name of an existing Secret holding the Slack bot token. Takes precedence over token.
    existingSecret: ""
    # -- Key of the Slack bot token inside existingSecret
    existingSecretKey: "slack-token"
  circleci:
    # -- CircleCI API token, optional: lets marge inspect private CircleCI projects and retry auto-cancelled builds. The chart writes it into a Secret; prefer existingSecret in production.
    token: ""
    # -- Name of an existing Secret holding the CircleCI token. Takes precedence over token.
    existingSecret: ""
    # -- Key of the CircleCI token inside existingSecret
    existingSecretKey: "token"

# -- Suspend every scheduled run without deleting its entry. A single run is suspended on its own entry instead.
suspendAll: false

# -- Values every entry of schedules takes for the keys it does not set itself.
scheduleDefaults:
  # -- IANA timezone the cron expressions are read in.
  timeZone: "Europe/Berlin"
  # -- Sweep steps a scheduled sweep performs. Every step here acts through the GitHub or CircleCI API; none of them writes code to a branch.
  actions: "classify,approve,merge,refresh,retry,remedy,mark"
  # -- Report every outcome without writing anything. Turn it on for the first runs on a new installation.
  dryRun: false
  # -- Seconds a scheduled run may take before Kubernetes stops it.
  activeDeadlineSeconds: 3600
  # -- Successful Jobs kept
  successfulJobsHistoryLimit: 3
  # -- Failed Jobs kept
  failedJobsHistoryLimit: 3
  # -- Container resources of a scheduled run. The pod mounts an emptyDir on /tmp, so ephemeral-storage is bounded as well: a container that mounts one without both bounds is refused by the restricted policies.
  resources:
    limits:
      cpu: 1
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi

# -- Scheduled runs, one CronJob each. An entry sweeps one team, so every team carries its own cadence and its own suspension. Needs marge.github.app. Stagger the expressions: every run acts as the same GitHub App and shares its rate limit.
schedules: []
  # - name: bumblebee-sweep     # names the CronJob and its ServiceAccount
  #   team: bumblebee           # the team this run sweeps
  #   schedule: "0 6 * * 1-5"
  #   suspend: false
  #   dryRun: false             # every other key defaults from scheduleDefaults
  # - name: bumblebee-rescue    # args replaces the generated command line
  #   team: bumblebee
  #   schedule: "0 5 * * 1"
  #   suspend: true
  #   args: []
  #   tokenAudience: "kagent"   # mounts a projected token at /var/run/secrets/kagent

networkPolicy:
  # -- Create a NetworkPolicy: ingress to the MCP port from the selected namespaces, egress to DNS and HTTPS only (GitHub, CircleCI).
  enabled: true
  # -- Namespaces allowed to reach the MCP port; an empty selector allows every namespace of the cluster.
  ingressNamespaceSelector: {}  # @schema additionalProperties: true
