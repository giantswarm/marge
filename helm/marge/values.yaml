# Default values for marge.

mcp:
  # -- Run the MCP server: the Deployment, its Service and its NetworkPolicy. Turn it off on an installation that runs the scheduled sweep alone, until a muster registers the server.
  enabled: true

muster:
  # -- Register the MCP server with muster, so a person reaches it through the gateway as themselves. Needs the App's OAuth client credentials and a muster in the cluster.
  register: false
  # -- Name of the MCPServer resource. Defaults to the release fullname.
  name: ""
  # -- Namespace the MCPServer is created in. Defaults to the release namespace; set it when muster watches another one.
  namespace: ""
  # -- Prefix muster gives the tools of this server, so they are reachable as x_<prefix>_<tool>.
  toolPrefix: "marge"
  # -- Description muster shows for the server.
  description: "Sweep a team's dependency and alignment PRs: list, sweep, remedy and mark, as the signed-in person."
  # -- Value of the agent-platform.giantswarm.io/tool-group label, which is how the portal and the toolset presets group a server. Empty leaves the label off.
  toolGroup: ""
  # -- Seconds muster waits on a connection to this server. The sweep reads the checks of every PR in a team's queue, which passes the CRD default of 30. The CRD caps the value at 300.
  timeout: 120  # @schema minimum: 1 ; maximum: 300
  github:
    # -- Issuer the grants are filed under, and the identity muster files them under, so it must match the value the other GitHub-backed servers use. GitHub publishes no discovery document, so the endpoints below are pinned instead.
    issuer: "https://github.com/login/oauth"
    # -- GitHub's authorization endpoint.
    authorizationEndpoint: "https://github.com/login/oauth/authorize"
    # -- GitHub's token endpoint.
    tokenEndpoint: "https://github.com/login/oauth/access_token"
    # -- OAuth scopes requested at sign-in. A GitHub App's user-to-server token takes its rights from the App's permissions and the person's own, so no scope is requested.
    scopes: ""

# -- Number of marge replicas. The MCP transport is stateful per session, so keep it at 1 unless a client-affine load balancer sits in front.
replicaCount: 1

image:
  # -- Registry of the marge image
  registry: gsoci.azurecr.io
  # -- Repository of the marge image
  repository: giantswarm/marge
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Image pull secrets for the pod
imagePullSecrets: []
# -- Overrides the chart name in resource names
nameOverride: ""
# -- Overrides the fully qualified resource name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the pod. marge talks to GitHub and CircleCI only, so it needs no Kubernetes API access.
  create: true
  # -- Mount the ServiceAccount token into the pod
  automount: false
  # -- Annotations to add to the ServiceAccount
  annotations: {}  # @schema additionalProperties: true
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty and create is true.
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels to add to the pod
podLabels: {}  # @schema additionalProperties: true

# -- Pod-level security context (restricted Pod Security Standard)
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (restricted Pod Security Standard)
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Service port; the container listens on 8080
  port: 8080

# -- Container resources
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Node selector for the pod
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations for the pod
tolerations: []
# -- Affinity for the pod
affinity: {}  # @schema additionalProperties: true

marge:
  github:
    # -- GitHub token marge uses (needs the permissions listed in the repository README). The chart writes it into a Secret; prefer existingSecret in production. The scheduled sweeps ignore it and act as the App instead.
    token: ""
    # -- Name of an existing Secret holding the GitHub token. Takes precedence over token.
    existingSecret: ""
    # -- Key of the GitHub token inside existingSecret
    existingSecretKey: "token"
    app:
      # -- Numeric ID of the sweep GitHub App. Required by the scheduled sweeps, which mint an installation token per repository instead of holding a token.
      id: ""
      # -- Numeric ID of the App's installation on the organization.
      installationId: ""
      # -- PEM private key of the App. The chart writes it into a Secret; prefer existingSecret in production. The values of this item live in 1Password, in the Team Bumblebee vault, item "marge sweep GitHub App".
      privateKey: ""
      # -- Name of an existing Secret holding the App credential. Takes precedence over the inline values, and must carry every key named below.
      existingSecret: ""
      # -- Key of the App ID inside the Secret
      idKey: "github-app-id"
      # -- Key of the installation ID inside the Secret
      installationIdKey: "github-app-installation-id"
      # -- Key of the PEM private key inside the Secret
      privateKeyKey: "github-app-private-key"
      oauth:
        # -- OAuth client ID of the App. marge never reads it; it is held here so one place holds the App's credentials, and muster's GitHub connector references the same Secret.
        clientId: ""
        # -- OAuth client secret of the App. Do not reuse the shared github-oauth-client secret.
        clientSecret: ""
        # -- Name of an existing Secret holding the OAuth client credentials. Takes precedence over the inline values.
        existingSecret: ""
        # -- Key of the client ID inside the Secret
        clientIdKey: "github-app-client-id"
        # -- Key of the client secret inside the Secret
        clientSecretKey: "github-app-client-secret"
  slack:
    # -- Bot token of the sweep's own Slack app, which holds chat:write and nothing else. Without it a scheduled sweep does its work and posts no summary.
    token: ""
    # -- Name of an existing Secret holding the Slack bot token. Takes precedence over token.
    existingSecret: ""
    # -- Key of the Slack bot token inside existingSecret
    existingSecretKey: "slack-token"
  circleci:
    # -- CircleCI API token, optional: lets marge inspect private CircleCI projects and retry auto-cancelled builds. The chart writes it into a Secret; prefer existingSecret in production.
    token: ""
    # -- Name of an existing Secret holding the CircleCI token. Takes precedence over token.
    existingSecret: ""
    # -- Key of the CircleCI token inside existingSecret
    existingSecretKey: "token"

schedule:
  daily:
    # -- Run the daily sweep. It sweeps every team whose policy file leaves the schedule enabled, and needs marge.github.app.
    enabled: false
    # -- Cron expression of the daily sweep, in the cluster's timezone unless timeZone is set.
    schedule: "0 6 * * *"
    # -- IANA timezone the cron expression is read in.
    timeZone: "Europe/Berlin"
    # -- Sweep steps the daily run performs. Every step here acts through the GitHub or CircleCI API; none of them writes code to a branch.
    actions: "classify,approve,merge,refresh,retry,remedy,mark"
    # -- Report every outcome without writing anything. Turn it on for the first runs on a new installation.
    dryRun: false
    # -- Seconds the daily run may take before Kubernetes stops it.
    activeDeadlineSeconds: 3600
    # -- Successful Jobs kept
    successfulJobsHistoryLimit: 3
    # -- Failed Jobs kept
    failedJobsHistoryLimit: 3
    # -- Container resources of the daily run
    resources:
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  weekly:
    # -- Run the weekly rescue trigger. It stays off until the rescue run exists: the command it would run is not built yet, so args has no default and an enabled weekly CronJob without args fails to render.
    enabled: false
    # -- Cron expression of the weekly rescue trigger.
    schedule: "0 5 * * 1"
    # -- IANA timezone the cron expression is read in.
    timeZone: "Europe/Berlin"
    # -- Arguments the weekly run passes to the marge binary.
    args: []
    # -- Audience of the projected ServiceAccount token the weekly run presents to the agent platform gateway. Mounted at /var/run/secrets/kagent/token.
    tokenAudience: "kagent"
    # -- Seconds the weekly run may take before Kubernetes stops it.
    activeDeadlineSeconds: 3600
    # -- Successful Jobs kept
    successfulJobsHistoryLimit: 3
    # -- Failed Jobs kept
    failedJobsHistoryLimit: 3
    # -- Container resources of the weekly run
    resources:
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

networkPolicy:
  # -- Create a NetworkPolicy: ingress to the MCP port from the selected namespaces, egress to DNS and HTTPS only (GitHub, CircleCI).
  enabled: true
  # -- Namespaces allowed to reach the MCP port; an empty selector allows every namespace of the cluster.
  ingressNamespaceSelector: {}  # @schema additionalProperties: true
