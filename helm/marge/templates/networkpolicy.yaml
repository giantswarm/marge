{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marge.fullname" . }}
  labels:
    {{- include "marge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # GitHub and CircleCI APIs
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
