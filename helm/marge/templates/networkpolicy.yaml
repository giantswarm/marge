{{- if and .Values.networkPolicy.enabled .Values.mcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marge.fullname" . }}
  labels:
    {{- include "marge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marge.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # GitHub, CircleCI and Slack APIs
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- range $entry := (include "marge.schedules" $ | fromYamlArray) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marge.cronName" (dict "context" $ "component" $entry.name) }}
  labels:
    {{- include "marge.labels" $ | nindent 4 }}
    {{- include "marge.scheduleLabels" (dict "entry" $entry) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marge.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $entry.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # GitHub, CircleCI and Slack APIs
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
{{- end }}
