{{- if include "marge.writesTokenSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marge.tokenSecretName" . }}
  labels:
    {{- include "marge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if include "marge.writesGitHubToken" . }}
  github-token: {{ .Values.marge.github.token | quote }}
  {{- end }}
  {{- if include "marge.writesCircleCIToken" . }}
  circleci-token: {{ .Values.marge.circleci.token | quote }}
  {{- end }}
  {{- if include "marge.writesSlackToken" . }}
  {{ .Values.marge.slack.existingSecretKey }}: {{ .Values.marge.slack.token | quote }}
  {{- end }}
  {{- if include "marge.writesAppCredential" . }}
  {{ .Values.marge.github.app.idKey }}: {{ .Values.marge.github.app.id | quote }}
  {{ .Values.marge.github.app.installationIdKey }}: {{ .Values.marge.github.app.installationId | quote }}
  {{ .Values.marge.github.app.privateKeyKey }}: |
    {{- .Values.marge.github.app.privateKey | nindent 4 }}
  {{- end }}
  {{- if include "marge.writesOAuthCredential" . }}
  {{ .Values.marge.github.app.oauth.clientIdKey }}: {{ .Values.marge.github.app.oauth.clientId | quote }}
  {{ .Values.marge.github.app.oauth.clientSecretKey }}: {{ .Values.marge.github.app.oauth.clientSecret | quote }}
  {{- end }}
{{- end }}
