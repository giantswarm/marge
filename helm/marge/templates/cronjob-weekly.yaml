{{- if .Values.schedule.weekly.enabled }}
{{- if not (include "marge.hasAppCredential" .) }}
{{- fail "schedule.weekly.enabled needs marge.github.app: set app.existingSecret, or app.id, app.installationId and app.privateKey." }}
{{- end }}
{{- if not .Values.schedule.weekly.args }}
{{- fail "schedule.weekly.enabled needs schedule.weekly.args: the weekly rescue trigger has no command yet, so the arguments are given by the operator rather than defaulted." }}
{{- end }}
{{- $component := "weekly-rescue" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "marge.cronName" (dict "context" . "component" $component) }}
  labels:
    {{- include "marge.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  schedule: {{ .Values.schedule.weekly.schedule | quote }}
  {{- with .Values.schedule.weekly.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.schedule.weekly.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.schedule.weekly.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.schedule.weekly.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "marge.labels" . | nindent 12 }}
            app.kubernetes.io/component: {{ $component }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "marge.cronServiceAccountName" (dict "context" . "component" $component) }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ .Chart.Name }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                {{- toYaml .Values.schedule.weekly.args | nindent 16 }}
              env:
                {{- include "marge.appEnv" . | nindent 16 }}
                {{- with (include "marge.slackEnv" .) }}
                {{- . | nindent 16 }}
                {{- end }}
                {{- with (include "marge.circleciEnv" .) }}
                {{- . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.schedule.weekly.resources | nindent 16 }}
              volumeMounts:
                - name: app-credential
                  mountPath: /etc/marge/github-app
                  readOnly: true
                - name: kagent-token
                  mountPath: /var/run/secrets/kagent
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: app-credential
              secret:
                secretName: {{ include "marge.appSecretName" . }}
                items:
                  - key: {{ .Values.marge.github.app.privateKeyKey }}
                    path: private-key.pem
            # The agent platform gateway verifies this token against the
            # cluster's ServiceAccount issuer, so the weekly run needs no
            # client secret of its own.
            - name: kagent-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: {{ .Values.schedule.weekly.tokenAudience | quote }}
                      expirationSeconds: 3600
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
