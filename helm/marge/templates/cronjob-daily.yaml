{{- if .Values.schedule.daily.enabled }}
{{- if not (include "marge.hasAppCredential" .) }}
{{- fail "schedule.daily.enabled needs marge.github.app: set app.existingSecret, or app.id, app.installationId and app.privateKey. The schedule acts as the sweep App and never as a person." }}
{{- end }}
{{- $component := "daily-sweep" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "marge.cronName" (dict "context" . "component" $component) }}
  labels:
    {{- include "marge.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  schedule: {{ .Values.schedule.daily.schedule | quote }}
  {{- with .Values.schedule.daily.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.schedule.daily.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.schedule.daily.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.schedule.daily.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "marge.labels" . | nindent 12 }}
            app.kubernetes.io/component: {{ $component }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "marge.cronServiceAccountName" (dict "context" . "component" $component) }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ .Chart.Name }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - sweep
                - --all-teams
                - --actions={{ .Values.schedule.daily.actions }}
                - --no-tui
                {{- if .Values.schedule.daily.dryRun }}
                - --dry-run
                {{- end }}
              env:
                {{- include "marge.appEnv" . | nindent 16 }}
                {{- with (include "marge.slackEnv" .) }}
                {{- . | nindent 16 }}
                {{- end }}
                {{- with (include "marge.circleciEnv" .) }}
                {{- . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.schedule.daily.resources | nindent 16 }}
              volumeMounts:
                - name: app-credential
                  mountPath: /etc/marge/github-app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: app-credential
              secret:
                secretName: {{ include "marge.appSecretName" . }}
                items:
                  - key: {{ .Values.marge.github.app.privateKeyKey }}
                    path: private-key.pem
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
