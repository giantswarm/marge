name: actions-runner-download-error
summary: A GitHub Actions step fails while downloading an action, a tool or a Docker action's image.
source: runbook row 86 (L291-316), transient infra
match:
  states: [failed]
  log:
    source: actions
    pattern: '(?i)Error: (Failed to download action|getaddrinfo EAI_AGAIN)|Error:.*HTTP 5\d\d.*(download|registry)|Error:.*429 Too Many Requests|##\[error\].*(429 Too Many Requests|Failed to download)|failed to resolve source metadata for .*: unexpected status from HEAD request .*: 429 Too Many Requests'
action:
  name: rerun-failed
evidence:
  reason: the step failed while downloading (an action, a tool or a Docker action's image), not while building, so the failed jobs were rerun
