name: release-asset-404-race
summary: A consumer job 404s on a release asset published moments earlier.
source: runbook row 33 (L151)
match:
  states: [failed]
  log:
    source: actions
    pattern: 'curl: \(22\).*404'
action:
  name: rerun-failed
evidence:
  reason: the release asset was not published yet when the job ran, so the failed jobs were rerun
