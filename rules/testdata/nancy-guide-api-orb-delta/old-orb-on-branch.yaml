name: a nancy guide-API failure on an old orb refreshes the branch
subject:
  state: stale
  kind: renovate
  title: "chore(deps): update module github.com/prometheus/common to v0.68.0"
  failing: ["go-test"]
  baseState:
    go-test: green
  logs:
    "circleci:go-test": |
      Error: guide API request failed: json: cannot unmarshal object into Go value of type []sonatypeguide.ComponentReportPost
      Exited with code exit status 1
expect:
  rule: nancy-guide-api-orb-delta
  check: go-test
