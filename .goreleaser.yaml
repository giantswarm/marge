---
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: marge
    main: .
    binary: marge
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: darwin
        formats: [zip]
    files:
      - none*
  # The bare binaries, under the names self-update downloads.
  - id: binary
    formats: [binary]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'

checksum:
  algorithm: sha256
  name_template: '{{ .ProjectName }}_checksums.txt'

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"

# Every asset gets a Sigstore bundle next to it, signed keyless by the
# release workflow (teemow/github-workflows release-go.yml). self-update
# verifies the download against it before replacing the binary.
signs:
  - cmd: cosign
    signature: '${artifact}.bundle'
    args: ['sign-blob', '--yes', '--bundle=${signature}', '${artifact}']
    artifacts: all
